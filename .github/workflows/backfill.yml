name: Recuperare zile lipsa
on:
  push:
    branches: [main]
    paths: ['.github/backfill.txt']
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instaleaza dependente
        working-directory: scripts
        run: npm install
      - name: Genereaza zilele din backfill.txt
        working-directory: scripts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          read START END MOD < ../.github/backfill.txt
          FORTA=""; [ "$MOD" = "force" ] && FORTA="--force"
          d="$START"
          while [ "$(date -d "$d" +%s)" -le "$(date -d "$END" +%s)" ]; do
            echo "=== $d ==="
            node genereaza-continut.js "$d" $FORTA || echo "::warning::EROARE la $d"
            sleep 2
            d=$(date -d "$d + 1 day" +%F)
          done
      - name: Verifica ca toate zilele sunt complete
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          read START END < ../.github/backfill.txt
          node verifica-interval.js "$START" "$END"
