name: Pre-randare lecturi zilei (pentru Google)

# În fiecare noapte, la 00:50 (ora României), cu a doua încercare dimineața,, scrie direct în HTML referința și textul
# Evangheliei și Apostolului zilei (aceleași ca pe site, din Biblia 1914), ca Google să le vadă.
# Doar fișierele evanghelia-zilei/index.html și apostolul-zilei/index.html se schimbă.
on:
  schedule:
    - cron: '50 21 * * *'   # 00:50 ora României vara
    - cron: '50 22 * * *'   # 00:50 ora României iarna (după generarea conținutului zilei)
    - cron: '30 3 * * *'    # 05:30 / 06:30 ora României: a doua încercare, dacă noaptea textul nu era gata
  push:
    branches: [main]
    paths: ['scripts/prerandare/**', '.github/workflows/prerandare-lecturi.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerandare-lecturi
  cancel-in-progress: false

jobs:
  prerandare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Instalează browserul
        run: |
          pip install -q playwright==1.48.0
          python -m playwright install --with-deps chromium > /dev/null
      - name: Pre-randează
        run: python scripts/prerandare/prerandeaza.py
      - name: Salvează (doar dacă s-a schimbat ceva)
        run: |
          git config user.name "povesti-bot"
          git config user.email "povesti-bot@users.noreply.github.com"
          git add evanghelia-zilei/index.html apostolul-zilei/index.html
          if git diff --cached --quiet; then echo "Nimic nou."; exit 0; fi
          git commit -q -m "chore: lecturile zilei în HTML [prerandare]"
          for i in 1 2 3; do
            if git pull -q --rebase origin main && git push -q origin HEAD:main; then
              sleep 120   # se așteaptă publicarea pe Vercel, apoi se anunță Bing (IndexNow)
              python scripts/indexnow/anunta.py evanghelia-zilei/index.html apostolul-zilei/index.html || true
              exit 0
            fi
            sleep 5
          done
          exit 1
