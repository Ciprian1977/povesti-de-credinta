name: Notificari Push Segmentate

# ═══════════════════════════════════════════════════════════════════════════════
# O singura rulare pe zi (dimineata devreme) PROGRAMEAZA in OneSignal fiecare
# notificare la ora aleasa de fiecare abonat (lista de ore din /setari-notificari).
# 01:30 UTC = 04:30 RO vara / 03:30 RO iarna (dupa generarea continutului zilei).
# Rulare manuala (Actions -> Run workflow):
#   - programeaza : programeaza ziua (sigur de repetat, nu dubleaza)
#   - test        : trimite ACUM o notificare de test tuturor abonatilor
#   - dimineata / pranz / seara / alerte_post : trimite ACUM acel segment
# ═══════════════════════════════════════════════════════════════════════════════

on:
  schedule:
    - cron: '30 1 * * *'
  push:
    branches: [main]
    paths: ['scripts/trimite-notificari.js', '.github/workflows/notificari-push.yml']
  workflow_dispatch:
    inputs:
      segment:
        description: 'programeaza, test, dimineata, pranz, seara sau alerte_post'
        required: true
        default: 'test'
      data_target:
        description: 'Data (YYYY-MM-DD, gol = azi in Romania)'
        required: false
        default: ''

jobs:
  trimite-notificari:
    name: Notificari
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scripts/package.json
      - name: Instaleaza dependente
        working-directory: scripts
        run: npm install
      - name: Ruleaza
        working-directory: scripts
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_API_KEY: ${{ secrets.ONESIGNAL_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          SEG="${{ github.event.inputs.segment }}"
          [ -z "$SEG" ] && SEG=programeaza
          node trimite-notificari.js "$SEG" ${{ github.event.inputs.data_target }}
