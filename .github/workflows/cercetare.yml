name: Cercetare surse (doar citire)
on:
  push:
    branches: [cercetare-surse]
permissions:
  contents: write
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: bash verificari2.sh
      - run: |
          cd out
          git init -q -b rezultate-1b2 && git add -A && git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm r
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" rezultate-1b2
