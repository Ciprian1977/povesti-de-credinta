<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — Povești de Credință</title>
  <style>
    body { font-family: Georgia, serif; background: #4A0F1C; color: #FDF6E3; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; text-align: center; padding: 20px; }
    .container { max-width: 400px; }
    .icon { font-size: 4rem; margin-bottom: 20px; }
    h1 { font-size: 1.5rem; color: #C9A84C; margin-bottom: 12px; }
    p { font-size: 0.95rem; opacity: 0.8; line-height: 1.6; margin-bottom: 20px; }
    .rugaciune { background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.3); border-radius: 12px; padding: 20px; font-style: italic; margin-top: 20px; }
    button { background: #C9A84C; color: #4A0F1C; border: none; padding: 12px 24px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; font-weight: 700; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🕯️</div>
    <h1>Ești offline</h1>
    <p>Nu ai conexiune la internet în acest moment. Încearcă din nou când ești conectat.</p>
    <button onclick="window.location.reload()">🔄 Încearcă din nou</button>
    <div class="rugaciune">
      <p style="margin-bottom:0">"Doamne Iisuse Hristoase, Fiul lui Dumnezeu, miluiește-mă pe mine, păcătosul."</p>
    </div>
  </div>
</body>
</html>
